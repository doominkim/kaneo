# olap-server 로컬 nginx — kaneo.vanpharm.com
#   test-web01 :443 ─ 192.168.9.32:8892 (이 파일) ─ 127.0.0.1:8893 (kaneo 컨테이너 :5173)
# vanpharm-mcp.conf(8890 → 8891) 와 같은 구조. 컨테이너는 loopback 에만 바인딩한다.
#   sudo cp ~/app/kaneo/nginx/olap-server-kaneo.conf /etc/nginx/sites-available/kaneo
#   sudo ln -s /etc/nginx/sites-available/kaneo /etc/nginx/sites-enabled/kaneo
#   sudo nginx -t && sudo systemctl reload nginx

map $http_x_forwarded_proto $kaneo_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

upstream kaneo_app {
    server 127.0.0.1:8893 max_fails=0;
}

server {
    listen 8892;
    listen [::]:8892;
    server_name _;

    client_max_body_size 50m;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kaneo_forwarded_proto;

    location ~ /\.(env|git|svn|aws|ssh) { return 404; }

    # MCP streamable HTTP/SSE: 버퍼링 끄고 길게 연다
    location ^~ /api/mcp {
        proxy_pass http://kaneo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://kaneo_app;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
