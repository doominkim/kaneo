# 앞단 서버(test-web01, 192.168.9.121)에 두는 설정.
#   → /etc/nginx/sites-available/kaneo.vanpharm.com
#
#   kaneo.vanpharm.com ─ 공유기 :443 ─ test-web01 nginx ─ 192.168.9.32:8892 ─ kaneo 컨테이너
#
# olap 쪽(mcp.vanpharm.com)과 달리 여기는 서브도메인을 쓴다. vanpharm.com 바로 아래
# 한 레벨이라 보유 인증서가 커버하는 범위 안이다. 앱이 루트에서 서빙되므로 prefix 를
# 떼거나 rewrite 하지 않는다.
#
# 컨테이너 내부 nginx 가 /api/ 를 api(:1337) 로, 나머지를 SPA 정적 파일로 보낸다.
# 그래서 여기서는 경로를 나누지 않고 통째로 넘긴다.
#
# ── 배치 ──────────────────────────────────────────────────────────────
#   ★ 443 블록은 인증서가 있어야 nginx -t 를 통과한다. 발급을 먼저 할 것(아래).
#
#   sudo cp test-web01-kaneo.conf /etc/nginx/sites-available/kaneo.vanpharm.com
#   sudo ln -s ../sites-available/kaneo.vanpharm.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   롤백: 심링크를 지우고 reload 한다. 앱과 DB 는 olap-server 에 그대로 남는다.
#
# ── 인증서 발급 (DNS A 레코드가 공유기 공인 IP 를 가리킨 뒤에) ────────
#   이 파일을 올리기 전이라 acme-challenge 를 받을 블록이 없다. 임시로 하나 띄운다:
#
#   sudo tee /etc/nginx/conf.d/zz-acme-kaneo.conf > /dev/null <<'EOF'
#   server {
#       listen 80;
#       server_name kaneo.vanpharm.com;
#       location /.well-known/acme-challenge/ { root /data/docker-apps/certbot/data; }
#       location / { return 404; }
#   }
#   EOF
#   sudo nginx -t && sudo systemctl reload nginx
#
#   docker run --rm --name cmd_certbot \
#     -v '/data/docker-apps/certbot/conf:/etc/letsencrypt' \
#     -v '/data/docker-apps/certbot/logs:/var/log/letsencrypt' \
#     -v '/data/docker-apps/certbot/data:/var/www/certbot' \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     --email it@charmacist.com --agree-tos --no-eff-email \
#     -d kaneo.vanpharm.com
#
#   발급되면 임시 블록을 지우고 이 파일을 배치한다:
#     sudo rm /etc/nginx/conf.d/zz-acme-kaneo.conf
#
#   renew.sh 에도 --cert-name kaneo.vanpharm.com 블록을 추가해야 자동 갱신 대상이 된다.
# ──────────────────────────────────────────────────────────────────────

    server {
        listen       80;
        server_name  kaneo.vanpharm.com;
        root         /usr/share/nginx/html;

        location ~ /.well-known/acme-challenge {
                allow all;
                root /data/docker-apps/certbot/data;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  kaneo.vanpharm.com;
        root         /usr/share/nginx/html;
        include      /etc/nginx/conf.d/proxy.conf;

        access_log /var/log/nginx/kaneo.access.log;
        error_log  /var/log/nginx/kaneo.error.log;

        ssl_certificate     "/data/docker-apps/certbot/conf/live/kaneo.vanpharm.com/fullchain.pem";
        ssl_certificate_key "/data/docker-apps/certbot/conf/live/kaneo.vanpharm.com/privkey.pem";
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;
        ssl_stapling        off;
        # 첨부 업로드는 컨테이너 내부 nginx 가 25m 로 제한한다. 앞단은 그보다 넉넉히.
        client_max_body_size 100M;
        add_header X-Content-Type-Options nosniff;

        # MCP 엔드포인트. streamable HTTP 는 응답이 SSE 스트림이라 버퍼링하면 멈춘다.
        # /api/mcp 아래에는 authorize·token·register 도 있는데, 버퍼링을 꺼도 문제없다.
        # ^~ 를 붙여 정규식 location 보다 먼저 잡히게 한다.
        #
        # 주의: nginx 의 proxy_set_header 는 "현재 레벨에 하나라도 있으면 상위 레벨을
        # 통째로 상속하지 않는다". 아래에서 헤더를 다시 쓰는 순간 server 레벨의
        # proxy.conf 헤더가 사라지므로, 필요한 헤더를 여기서 전부 다시 지정한다.
        location ^~ /api/mcp {
            proxy_pass http://192.168.9.32:8892;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE 는 keep-alive 다. Upgrade 헤더를 그대로 넘기면 안 된다.
            proxy_set_header Connection        "";
            # 스트림 응답에 압축이 끼면 클라이언트가 이벤트 경계를 늦게 본다.
            proxy_set_header Accept-Encoding   "";

            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_cache             off;
            chunked_transfer_encoding on;
            # MCP 세션은 오래 열려 있다. proxy.conf 기본 90s 로는 끊긴다.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # OAuth discovery 는 표준상 루트 경로에도 있어야 한다. 컨테이너 내부 nginx 가
        # 두 경로를 모두 api 로 넘기므로 여기서는 분기 없이 통과시킨다.
        location / {
            proxy_pass http://192.168.9.32:8892;
            proxy_read_timeout 300s;
        }
    }
